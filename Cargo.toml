[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-native-tls", "derive", "chrono"] }
tower-http = { version = "0.6.11", features = ["cors"] }
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
